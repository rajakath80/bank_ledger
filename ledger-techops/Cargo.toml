[package]
name = "ledger-techops"
version = "0.1.0"
edition = "2024"
description = "MCP server exposing TechOps tools: query_logs, get_latency_metrics, get_trace, create_incident."

[dependencies]
ledger-log = { path = "../ledger-log" }
ledger-store = { path = "../ledger-store" }
anyhow = "1.0.104"
rmcp = { version = "3.2.0", features = ["client", "transport-io"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "io-std"] }
schemars = "1.2.2"
