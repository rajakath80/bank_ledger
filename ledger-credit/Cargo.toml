[package]
name = "ledger-credit"
version = "0.1.0"
edition = "2024"
description = "Credit decisioning: real internal signals + labelled-synthetic external signals, transparent scorecard, audit log. Plain Axum service."

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
ledger-core = { path = "../ledger-core" }
ledger-types = { path = "../ledger-types" }
ledger-log = { path = "../ledger-log" }
ledger-store = { path = "../ledger-store" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }