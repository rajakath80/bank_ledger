[package]
name = "ledger-finops"
version = "0.1.0"
edition = "2024"
description = "MCP server exposing FinOps tools: get_infrastructure_cost, get_product_volume, calculate_unit_cost, compare_periods."

[dependencies]
ledger-core = { path = "../ledger-core" }
ledger-log = { path = "../ledger-log" }
ledger-store = { path = "../ledger-store" }
ledger-tags = { path = "../ledger-tags" }
ledger-types = { path = "../ledger-types" }
anyhow = "1.0.104"
rmcp = { version = "3.2.0", features = ["client", "transport-io"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "io-std"] }
schemars = "1.2.2"
