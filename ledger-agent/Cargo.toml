[package]
name = "ledger-agent"
version = "0.1.0"
edition = "2024"
description = "Local driver: connects Ollama (Qwen3, tool-calling) to the Ledger Guardian MCP server."
 
[dependencies]
anyhow = "1.0.104"
reqwest = { version = "0.13.4", features = ["json"] }
rmcp = { version = "3.2.0", features = ["client", "transport-child-process"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "process", "io-std", "io-util"] }
